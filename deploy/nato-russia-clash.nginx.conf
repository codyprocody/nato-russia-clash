server {
    listen 80;
    listen [::]:80;
    server_name nato-russia-clash.169-58-205-255.sslip.io;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /opt/projects/nato-russia-clash;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nato-russia-clash.169-58-205-255.sslip.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/nato-russia-clash.169-58-205-255.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nato-russia-clash.169-58-205-255.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/projects/nato-russia-clash;
    index index.html;
    autoindex off;
    client_max_body_size 1k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
